<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Terra Nova Journal | Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #050810; color: white; }
    .glass { background: rgba(255,255,255,0.025); border: 1px solid rgba(255,255,255,0.1); }
    .tag { border: 1px solid rgba(255,255,255,0.18); border-radius: 9999px; padding: 6px 10px; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; }
    .tag.active { border-color: rgba(165,196,154,0.8); color: #d4ebc7; }
  </style>
</head>
<body>
  <header class="border-b border-white/10 px-5 py-5 sm:px-8">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-4">
      <a href="/" class="text-xs font-bold tracking-[0.25em]">TERRA NOVA</a>
      <nav class="flex items-center gap-5 text-sm text-gray-300">
        <a href="/" class="hover:text-white">Home</a>
        <a href="/campaigns.html" class="hover:text-white">Campaigns</a>
        <a href="/stories.html" class="hover:text-white">Case studies</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-5 py-16 sm:px-8 sm:py-24">
    <div class="max-w-3xl">
      <p class="text-xs uppercase tracking-[0.3em] text-[#a5c49a]">Terra Nova Journal</p>
      <h1 class="mt-4 font-['Cinzel'] text-4xl uppercase leading-tight sm:text-6xl">Blog and impact stories</h1>
      <p class="mt-5 max-w-2xl text-sm leading-relaxed text-gray-300">Insights, field notes, and practical updates about climate systems, biodiversity, and resilient communities.</p>
    </div>

    <div class="mt-8 flex flex-wrap gap-2" id="tag-group" aria-label="Article filters"></div>
    <div id="blog-status" class="mt-6 text-sm text-gray-400" role="status" aria-live="polite">Loading articles...</div>
    <div id="blog-grid" class="mt-8 grid gap-6 md:grid-cols-2 xl:grid-cols-3"></div>
  </main>

  <script>
    const state = { category: 'all', tag: '' };
    const localHosts = ['localhost', '127.0.0.1', '::1'];
    const useLocalApiServer = location.protocol === 'file:' || (localHosts.includes(location.hostname) && location.port !== '3000');
    const apiOrigin = useLocalApiServer ? `http://${location.hostname || 'localhost'}:3000` : location.origin;
    const tagGroup = document.getElementById('tag-group');
    const blogGrid = document.getElementById('blog-grid');
    const blogStatus = document.getElementById('blog-status');

    function apiUrl(path) {
      return `${apiOrigin}${path}`;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    }

    function renderTags(tags, categories) {
      const entries = ['all', ...categories];
      tagGroup.innerHTML = entries.map(entry => {
        const label = entry === 'all' ? 'All' : entry;
        const active = state.category === entry ? 'active' : '';
        return `<button class="tag ${active}" data-category="${escapeHtml(entry)}">${escapeHtml(label)}</button>`;
      }).join('');

      tagGroup.querySelectorAll('[data-category]').forEach(button => {
        button.addEventListener('click', () => {
          const nextCategory = button.dataset.category;
          state.category = nextCategory === 'all' ? 'all' : nextCategory;
          loadArticles();
        });
      });
    }

    async function loadArticles() {
      blogStatus.textContent = 'Loading articles...';
      try {
        const params = new URLSearchParams();
        if (state.category !== 'all') params.set('category', state.category);
        if (state.tag) params.set('tag', state.tag);
        const response = await fetch(apiUrl(`/api/articles?${params.toString()}`), { headers: { Accept: 'application/json' } });
        const contentType = response.headers.get('content-type') || '';
        if (!contentType.includes('application/json')) {
          throw new Error(`The journal API at ${apiOrigin} returned a page instead of JSON. Make sure the app server is running.`);
        }
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Articles could not be loaded.');

        const { articles = [], categories = [], tags = [] } = data;
        renderTags(tags, categories);
        if (!articles.length) {
          blogGrid.innerHTML = '<article class="glass rounded-2xl p-6 text-gray-300">No articles are available for this filter yet.</article>';
          blogStatus.textContent = 'No articles are available yet.';
          return;
        }

        blogGrid.innerHTML = articles.map(article => {
          const author = article.author || {};
          const image = article.featuredImage || 'assets/hero_bg.webp';
          return `
            <article class="glass rounded-2xl overflow-hidden">
              <div class="aspect-[16/10] overflow-hidden">
                <img src="${image}" alt="${escapeHtml(article.title)}" loading="lazy" decoding="async" class="h-full w-full object-cover" />
              </div>
              <div class="p-6">
                <div class="flex items-center justify-between gap-2 text-[10px] uppercase tracking-[0.22em] text-[#a5c49a]">
                  <span>${escapeHtml(article.category)}</span>
                  <span class="text-gray-400">${article.publishedAt ? new Date(article.publishedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : ''}</span>
                </div>
                <h2 class="mt-4 font-['Cinzel'] text-2xl text-white">${escapeHtml(article.title)}</h2>
                <p class="mt-3 text-sm text-gray-300 leading-relaxed">${escapeHtml(article.excerpt)}</p>
                <div class="mt-4 flex flex-wrap gap-2">
                  ${(article.tags || []).slice(0, 3).map(tag => `<button type="button" class="tag" data-tag="${escapeHtml(tag)}">${escapeHtml(tag)}</button>`).join('')}
                </div>
                <div class="mt-6 flex items-center justify-between text-xs text-gray-400">
                  <span>By ${escapeHtml(author.name || 'Terra Nova')}</span>
                  <a href="/article.html?slug=${encodeURIComponent(article.slug)}" class="inline-flex items-center gap-2 text-[#c2d9b8] hover:text-white">Read article <span aria-hidden="true">→</span></a>
                </div>
              </div>
            </article>
          `;
        }).join('');

        blogGrid.querySelectorAll('[data-tag]').forEach(button => {
          button.addEventListener('click', () => {
            state.tag = button.dataset.tag;
            state.category = 'all';
            loadArticles();
          });
        });

        blogStatus.textContent = `${articles.length} article${articles.length === 1 ? '' : 's'} loaded.`;
      } catch (error) {
        blogStatus.textContent = error.message || 'Could not load articles.';
        blogGrid.innerHTML = '<article class="glass rounded-2xl p-6 text-red-300">The journal is unavailable right now.</article>';
      }
    }

    loadArticles();
  </script>
</body>
</html>
